<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Cola HQ</title>
<meta name="description" content="Agent Cola HQ: sculpting, coding, 3D printing, and overlays, live on twitch.tv/agentcolahq. Full site coming soon.">
<style>
  :root { --bg:#111111; --fg:#f2f2f2; --dim:#a6a6a6; --line:#333333; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:grid; place-items:center; padding:24px 16px; text-align:center; }
  main { display:grid; gap:20px; max-width:520px; }
  h1 { margin:0; font-size:clamp(32px,8vw,52px); letter-spacing:.02em; }
  p { margin:0; color:var(--dim); font-size:18px; line-height:1.5; }
  nav { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
  a { color:var(--fg); text-decoration:none; border:1px solid var(--line);
    padding:10px 16px; border-radius:6px; }
  a:hover, a:focus-visible { border-color:var(--fg); outline:none; }
  small { color:var(--dim); }
</style>
</head>
<body>
<main>
  <h1>Agent Cola HQ</h1>
  <p>The full site is under construction. Until then, you can find me here.</p>
  <nav>
    <a href="https://twitch.tv/agentcolahq">Twitch</a>
    <a href="https://www.tiktok.com/@agent_cola">TikTok</a>
    <a href="https://instagram.com/agentcolahq">Instagram</a>
    <a href="https://github.com/AgentColaHQ">GitHub</a>
  </nav>
  <small>Live Tuesday, Friday, and Saturday at 8:00 PM Central.</small>
</main>
</body>
</html>
